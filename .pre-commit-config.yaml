# Run with: uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic]
        args: [--strict]
        files: ^src/
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # Blocks commits that introduce a new secret. Known false-positives
      # (template placeholders, fake test keys) are allowlisted in
      # .secrets.baseline. The lockfile's SHA-256 hashes are not secrets.
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '^uv\.lock$'
