name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (not floating tags) for supply-chain safety.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync (locked, no upgrades)
        run: uv sync --locked

      - name: Verify lockfile is in sync
        run: uv lock --check

      - name: Scan for secrets
        # Fails if any tracked file contains a secret not allowlisted in
        # .secrets.baseline. uv.lock is excluded (its entries are dependency
        # integrity hashes, not secrets).
        run: uv run detect-secrets-hook --baseline .secrets.baseline $(git ls-files -- ':!uv.lock')

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest

      - name: Audit dependencies
        # PYSEC-2026-196 affects pip 26.1.1 (a transitive dev-tool dependency via
        # pip-audit -> pip-api -> pip; never run at app runtime). The fix, pip 26.1.2,
        # is held back by our own `exclude-newer = "14 days"` cooldown until ~2026-06-14.
        # Remove this ignore and run `uv lock --upgrade-package pip` once it clears.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-196
