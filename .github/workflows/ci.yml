name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, plus each newer CPython release.
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      # Actions are pinned by commit SHA (not floating tags) for supply-chain safety.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Verify lockfile is in sync
        run: uv lock --check

      - name: Sync (locked, no upgrades)
        run: uv sync --locked

      - name: Scan for secrets
        # Fails if any tracked file contains a secret not allowlisted in
        # .secrets.baseline. uv.lock is excluded (its entries are dependency
        # integrity hashes, not secrets).
        run: uv run detect-secrets-hook --baseline .secrets.baseline $(git ls-files -- ':!uv.lock')

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check (src and tests, strict)
        run: uv run mypy

      - name: Tests (unit, SDK contract and smoke; fails under 95% coverage)
        run: uv run pytest

      - name: Audit dependencies
        run: uv run pip-audit
